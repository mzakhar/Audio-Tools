name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mzakhar/audio-tools:main
            ghcr.io/mzakhar/audio-tools:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.discovery
          push: true
          tags: |
            ghcr.io/mzakhar/audio-tools-discovery:main
            ghcr.io/mzakhar/audio-tools-discovery:sha-${{ github.sha }}
          cache-from: type=gha,scope=discovery
          cache-to: type=gha,mode=max,scope=discovery
