<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src blob: 'self' http://localhost:*; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none';">
  <title>SYNTH</title>
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="layout">
    <nav id="sidebar" aria-label="Sidebar navigation">
      <button class="tool-btn active" data-tool="synth" title="Synthesizer (F1)" aria-pressed="true">
        <span class="tool-icon" aria-hidden="true">◈</span>
        <span class="tool-label">SYNTH</span>
      </button>
      <button class="tool-btn" id="arrange-btn" data-tool="arrange" title="Arrangement (F2)" aria-pressed="false">
        <span class="tool-icon" aria-hidden="true">▦</span>
        <span class="tool-label">ARRANGE</span>
      </button>
      <button class="tool-btn" data-tool="rack" title="Rack (F3)" aria-pressed="false">
        <span class="tool-icon" aria-hidden="true">⌘</span>
        <span class="tool-label">RACK</span>
      </button>
    </nav>
    <div id="main" data-view="synth">
    <div id="command-bar" role="toolbar" aria-label="Commands">
      <span id="project-name" title="Project">No Project</span>
      <span id="project-dirty" class="dirty-mark" aria-label="Unsaved changes" hidden>*</span>
      <button id="global-play-btn" class="cmd-btn play" data-cmd="play" aria-label="Play" aria-pressed="false">▶</button>
      <button id="global-stop-btn" class="cmd-btn stop" data-cmd="stop" aria-label="Stop">■</button>
      <button id="rec-btn" class="cmd-btn rec-btn" data-cmd="record" aria-label="Record master audio" aria-pressed="false">●</button>
      <span id="rec-timer" class="rec-timer" aria-live="off" hidden>00:00</span>
      <label class="cmd-label" for="global-bpm">BPM</label>
      <input type="number" id="global-bpm" min="40" max="240" value="120" aria-label="Tempo in BPM">
      <label class="cmd-label" for="master-vol">VOL</label>
      <input type="range" id="master-vol" min="0" max="1" step="0.01" value="0.8" aria-label="Master volume">
      <span class="knob-val" id="master-vol-display" aria-hidden="true">80</span>
      <span class="cmd-spacer" aria-hidden="true"></span>
      <button id="mixer-toggle-btn" class="cmd-btn" data-cmd="mixer" aria-pressed="false" aria-label="Mixer (Ctrl+Shift+M)" hidden>MIX</button>
      <button id="midi-token" class="cmd-token" data-cmd="midi-token" aria-label="MIDI setup (Ctrl+M)" hidden>
        <span class="cmd-dot" aria-hidden="true">●</span><span id="midi-token-name"></span>
      </button>
      <button id="app-menu-btn" class="cmd-btn" popovertarget="app-menu" aria-label="More commands" aria-haspopup="menu">⋯</button>
    </div>
    <div id="app-menu" popover role="menu" aria-label="Commands"></div>
    <div id="arrange-view">
      <div id="arrange-workspace">
        <div id="arrangement-container" aria-label="Arrangement timeline" role="region"></div>
        <aside id="instrument-inspector" aria-label="Selected track instrument"></aside>
      </div>
      <div id="mixer-bar" role="region" aria-label="Mixer"></div>
    </div>
    <section id="rack-view" aria-label="Modular rack" style="display:none"></section>
  <div id="app">

    <div id="palette-tabs" role="tablist" aria-label="Palette">
      <button class="tab active" data-palette="classic" role="tab" aria-selected="true">CLASSIC</button>
      <button class="tab" data-palette="fm" role="tab" aria-selected="false">FM SYNTH</button>
      <button class="tab" data-palette="drum" role="tab" aria-selected="false">DRUM MACHINE</button>
      <button class="tab" data-palette="tr909" role="tab" aria-selected="false">909</button>
      <button class="tab" data-palette="pad" role="tab" aria-selected="false">PAD / AMBIENT</button>
    </div>

    <section id="knob-panel" aria-label="Palette parameters" role="tabpanel">
      <!-- Populated dynamically by app.js -->
    </section>

    <section id="tr909-view" aria-label="909 rhythm composer" role="tabpanel" style="display:none"></section>

    <section id="keyboard-section" aria-label="On-screen keyboard">
      <div id="keyboard-wrap">
        <div id="keyboard" role="group" aria-label="Piano keys"></div>
      </div>
      <div id="drum-pads" role="group" aria-label="Drum pads"></div>
      <div id="keyboard-hint" aria-hidden="true">
        PC Keys — White: <kbd>a</kbd><kbd>s</kbd><kbd>d</kbd><kbd>f</kbd><kbd>g</kbd><kbd>h</kbd><kbd>j</kbd> &nbsp;|&nbsp; Black: <kbd>w</kbd><kbd>e</kbd><kbd>t</kbd><kbd>y</kbd><kbd>u</kbd> &nbsp;|&nbsp; Upper: <kbd>k</kbd><kbd>l</kbd><kbd>;</kbd><kbd>'</kbd><kbd>z</kbd><kbd>x</kbd><kbd>c</kbd>
      </div>
      <div id="drum-hint" aria-hidden="true">
        PC Keys — <kbd>1</kbd> Kick &nbsp;|&nbsp; <kbd>2</kbd> Snare &nbsp;|&nbsp; <kbd>3</kbd> Hi-Hat &nbsp;|&nbsp; <kbd>4</kbd> Clap
      </div>
    </section>

    <section id="sequencer-section" aria-label="Step sequencer">
      <div id="seq-tracks"></div>
      <div id="sequencer-controls">
        <div class="transport" role="toolbar" aria-label="Transport">
          <button id="clear-btn" class="transport-btn clear">✕ Clear</button>
          <button id="add-track-btn" class="transport-btn">+ Track</button>
        </div>
      </div>
    </section>

  </div>
    </div>
  </div>

  <dialog id="piano-roll-dialog" class="pr-dialog" aria-labelledby="pr-dialog-title">
    <div class="pr-drawer-header">
      <span id="pr-dialog-title" class="pr-title">PIANO ROLL — <span id="pr-clip-name"></span></span>
      <div class="pr-tools" role="radiogroup" aria-label="Piano roll tool">
        <button class="pr-tool-btn active" data-pr-tool="draw" role="radio" aria-checked="true" title="Draw notes (D)">✎ DRAW</button>
        <button class="pr-tool-btn" data-pr-tool="select" role="radio" aria-checked="false" title="Select notes (S)">⊹ SELECT</button>
        <button class="pr-tool-btn" data-pr-tool="erase" role="radio" aria-checked="false" title="Erase notes (E)">✕ ERASE</button>
        <span class="pr-sep" aria-hidden="true">|</span>
        <label for="pr-quantize" class="pr-label">SNAP</label>
        <select id="pr-quantize" aria-label="Quantize snap">
          <option value="0.03125">1/32</option>
          <option value="0.0625">1/16</option>
          <option value="0.125">1/8</option>
          <option value="0.25" selected>1/4</option>
          <option value="0.5">1/2</option>
          <option value="1">1 bar</option>
        </select>
      </div>
      <button id="close-piano-roll-btn" class="pr-close-btn" aria-label="Close piano roll (Escape)">✕ CLOSE</button>
    </div>
    <div id="piano-roll-container"></div>
  </dialog>

  <dialog id="midi-setup-dialog" class="app-dialog" aria-labelledby="midi-setup-title">
    <div class="dlg-header">
      <span id="midi-setup-title" class="dlg-title">MIDI SETUP</span>
      <button class="dlg-close-btn" data-close-dialog="midi-setup-dialog" aria-label="Close MIDI setup">✕</button>
    </div>
    <div class="dlg-body">
      <div class="dlg-row">
        <span id="midi-status" class="midi-status" aria-live="polite" aria-atomic="true">MIDI OFF</span>
        <button id="midi-enable-btn" class="midi-btn">ENABLE MIDI</button>
      </div>
      <div class="dlg-row">
        <label class="dlg-label" for="midi-device-select">INPUT</label>
        <select id="midi-device-select" class="midi-select" aria-label="MIDI input device" style="display:none">
          <option value="">— no device —</option>
        </select>
      </div>
      <div class="dlg-row">
        <button id="midi-record-btn" class="midi-rec-btn" aria-label="Record MIDI" aria-pressed="false" style="display:none" disabled>⏺ MIDI REC</button>
      </div>
      <p class="dlg-note">Web MIDI needs a secure context (https or localhost). On the plain-http LAN address there is no MIDI at all.</p>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
