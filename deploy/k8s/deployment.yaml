apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth
  namespace: synth
  labels:
    app.kubernetes.io/name: synth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synth
    spec:
      containers:
        - name: synth
          # Pinned by digest so the manifest itself is the deploy trigger: with a
          # mutable :main tag Flux re-applies an identical spec and nothing rolls,
          # which is why deploys needed a manual rollout restart. Bump this digest
          # to deploy; the tag is kept for readability only.
          image: ghcr.io/mzakhar/audio-tools:main@sha256:631e5524d8a63695e35f27f8851574bec3ce557e28a61fea44c77a5eaca9f074
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
