apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth
  namespace: synth
  labels:
    app.kubernetes.io/name: synth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synth
    spec:
      containers:
        - name: synth
          # Floating tag on purpose. The deployed digest is pinned in the fleet
          # repo, homelab-fleet clusters/themachine/apps/synth.yaml, as a
          # Kustomization images override — that override wins over whatever is
          # written here, so editing this line does not deploy anything.
          image: ghcr.io/mzakhar/audio-tools:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
